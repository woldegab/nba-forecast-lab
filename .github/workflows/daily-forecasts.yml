# Each morning: record last night's final scores and save today's forecasts
# before any game tips off, then commit the ledger. The commit timestamp is
# public proof that each forecast existed before its game.
name: Daily forecasts

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 9 a.m. Central (10 a.m. during daylight time)
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-forecasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Record results and today's forecasts
        run: python backend/live_forecast.py update
      # Free Gemini API key in repo secrets (optional). Without it, or if the API
      # is unavailable, every game gets a template preview and the job still passes.
      - name: Write game previews
        run: python backend/previews.py update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Write recaps of finished games
        run: python backend/recaps.py update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit the ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/live/
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Forecasts for $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi
